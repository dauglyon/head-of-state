[project]
name = "head-of-state"
version = "0.1.0"
description = "Zero-shot regime tracking from an open-weights LLM's output head."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate",
    "flash-linear-attention",
    "numpy",
    "tokenizers",
    "torch",
    "transformers>=5.24",
]

[project.scripts]
head-of-state = "head_of_state.reader:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/head_of_state"]

# torch comes from the CUDA 12.8 build index (needs an NVIDIA driver that supports CUDA 12.8 or later).
# For another platform, remove these two tables and run `uv lock` again.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
